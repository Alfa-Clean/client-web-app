name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}
          VITE_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}
          VITE_BASEMAP_MODE: ${{ vars.VITE_BASEMAP_MODE }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Сообщение коммита идёт через env, а не подстановкой в тело скрипта:
      # `${{ }}` разворачивается ДО запуска shell, поэтому обратные кавычки
      # или $(...) в тексте коммита выполнялись бы как команды на раннере,
      # у которого есть доступ к секретам.
      - name: Notify Telegram
        if: success()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACTOR: ${{ github.actor }}
        run: |
          MESSAGE="✅ client-web-app задеплоен"$'\n'"📝 ${COMMIT_MSG}"$'\n'"👤 ${ACTOR}"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
